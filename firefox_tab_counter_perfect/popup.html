<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Firefox Tab Counter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; 
      width: 450px; min-height: 400px; padding: 15px; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    h1 { 
      text-align: center; margin-bottom: 20px; font-size: 20px; 
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .stats { 
      background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; 
      margin-bottom: 20px; backdrop-filter: blur(10px);
    }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 16px; }
    .stat-number { font-size: 28px; font-weight: bold; color: #FFD700; }
    #table-container { 
      background: rgba(255,255,255,0.15); border-radius: 12px; overflow: hidden; 
      max-height: 350px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
    th { background: rgba(255,255,255,0.2); font-weight: 600; }
    tr:hover { background: rgba(255,255,255,0.1); }
    .id { font-family: monospace; font-size: 12px; color: #FFD700; }
    .time { font-size: 11px; opacity: 0.9; }
    .status { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .loading { background: #FF9500; }
    .complete { background: #34C759; }
    button { 
      width: 100%; padding: 12px; background: rgba(255,255,255,0.2); 
      border: none; border-radius: 8px; color: white; font-size: 14px; 
      cursor: pointer; margin-top: 15px; backdrop-filter: blur(10px);
    }
    button:hover { background: rgba(255,255,255,0.3); }
    .empty { text-align: center; padding: 40px; opacity: 0.7; }
  </style>
</head>
<body>
  <h1>🔥 Firefox Tab Counter</h1>
  <div class=\"stats\">
    <div class=\"stat-row\"><span>总标签页数:</span><span class=\"stat-number\" id=\"total-count\">0</span></div>
    <div class=\"stat-row\"><span>窗口数:</span><span class=\"stat-number\" id=\"window-count\">0</span></div>
    <div class=\"stat-row\"><span>最近更新:</span><span class=\"stat-number\" id=\"last-update\">从未</span></div>
  </div>
  
  <div id=\"table-container\">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>标题</th>
          <th>URL</th>
          <th>最后访问</th>
          <th>状态</th>
          <th>窗口</th>
        </tr>
      </thead>
      <tbody id=\"tab-table\">
        <tr><td colspan=\"5\" class=\"empty\">点击刷新加载标签页数据...</td></tr>
      </tbody>
    </table>
  </div>
  
  <button onclick=\"loadTabs()\">🔄 刷新数据</button>
  
  <script src="popup.js"></script>
</body>
</html>
